name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: aube ci

      - name: Biome
        run: aube exec biome ci

      - name: Type check
        run: aube run check

      - name: Build output tests
        run: aube run test

      - name: Install Playwright browser
        run: aube exec playwright install --with-deps chromium

      - name: Browser tests
        run: aube run test:e2e

      - name: Build
        run: aube run build

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
